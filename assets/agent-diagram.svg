<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" width="1040" height="430" role="img" aria-label="Banking support agent: a customer message goes to the intent classifier (this project), which emits one of 77 intent labels; a router maps the label to an automated reply, a suggested help doc, or a human agent. Dashed paths show an off-list guard that sends unrecognised answers to a human, and human corrections feeding back into retraining." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1040" height="430" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#1f2937">
    <!-- title + legend -->
    <text x="24" y="34" font-size="17" font-weight="700">Banking support agent: where the intent classifier fits</text>
    <text x="24" y="54" font-size="12" fill="#6b7280">Solid = request path. Dashed = around the classifier, not built in this project. Routing shown is illustrative.</text>

    <!-- customer -->
    <rect x="24" y="155" width="150" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="99" y="187" font-size="14" font-weight="700" text-anchor="middle">Customer</text>
    <text x="99" y="206" font-size="13" text-anchor="middle" fill="#6b7280">message</text>

    <line x1="174" y1="190" x2="248" y2="190" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="211" y="182" font-size="11" text-anchor="middle" fill="#6b7280">raw text</text>

    <!-- classifier (this project) -->
    <text x="250" y="120" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="1.2">THIS PROJECT</text>
    <rect x="250" y="130" width="250" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="375" y="162" font-size="16" font-weight="700" text-anchor="middle">Intent classifier</text>
    <text x="375" y="186" font-size="13" text-anchor="middle">Muse Glimmer 30B + LoRA</text>
    <text x="375" y="207" font-size="13" text-anchor="middle" fill="#6b7280">replies with exactly 1 of 77 labels</text>
    <text x="375" y="228" font-size="13" text-anchor="middle" fill="#6b7280">~66 tokens per call</text>

    <line x1="500" y1="190" x2="558" y2="190" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="529" y="182" font-size="11" text-anchor="middle" fill="#6b7280">label</text>

    <!-- router -->
    <rect x="560" y="155" width="130" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="625" y="187" font-size="14" font-weight="700" text-anchor="middle">Router</text>
    <text x="625" y="206" font-size="12" text-anchor="middle" fill="#6b7280">intent → action</text>

    <!-- router branches -->
    <polyline points="690,190 730,190 730,90 798,90" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="690" y1="190" x2="798" y2="190" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)"/>
    <polyline points="690,190 730,190 730,290 798,290" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="736" y="82" font-size="11" fill="#6b7280">answerable</text>
    <text x="736" y="182" font-size="11" fill="#6b7280">has a doc</text>
    <text x="736" y="282" font-size="11" fill="#6b7280">escalate</text>

    <!-- outcomes -->
    <rect x="800" y="62" width="216" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="908" y="96" font-size="14" font-weight="700" text-anchor="middle">Automated reply</text>
    <rect x="800" y="162" width="216" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="908" y="196" font-size="14" font-weight="700" text-anchor="middle">Suggested help doc</text>
    <rect x="800" y="262" width="216" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="908" y="296" font-size="14" font-weight="700" text-anchor="middle">Human agent</text>

    <!-- guard: off-list answer -> human -->
    <polyline points="430,250 430,350 870,350 870,320" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrD)"/>
    <text x="650" y="342" font-size="12" text-anchor="middle" fill="#6b7280">answer is not one of the 77 labels → human</text>

    <!-- feedback: corrections -> retrain -->
    <polyline points="950,320 950,392 330,392 330,252" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrD)"/>
    <text x="640" y="414" font-size="12" text-anchor="middle" fill="#6b7280">human corrections → new training rows → retrain the LoRA (~$5 per run at list price)</text>
  </g>
</svg>
